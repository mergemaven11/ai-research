<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A 12-week visual, hands-on AI engineering curriculum with lessons, diagrams, 3D concept demos, labs, homework, and progress tracking." />
  <title>AI Research Lab — 12-Week Learning Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app-main">Skip to course content</a>

  <header class="app-header">
    <a class="brand" href="#dashboard" data-nav="dashboard">
      <span class="brand-mark">AI</span>
      <span>
        <strong>AI Research Lab</strong>
        <small>12-week learning platform</small>
      </span>
    </a>

    <div class="header-progress" aria-label="Course progress">
      <div class="header-progress-copy">
        <span>Course progress</span>
        <strong id="header-progress-label">0%</strong>
      </div>
      <div class="progress-track" aria-hidden="true">
        <span id="header-progress-bar"></span>
      </div>
    </div>

    <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Open course navigation">☰</button>
  </header>

  <div class="app-shell">
    <aside class="course-sidebar" id="course-sidebar" aria-label="Course navigation">
      <div class="sidebar-head">
        <p class="eyebrow">Course curriculum</p>
        <h2>AI Systems Engineering</h2>
        <p>Learn first. Practice second. Ship evidence.</p>
      </div>

      <button class="dashboard-link active" type="button" data-nav="dashboard">
        <span>⌂</span>
        <span><strong>Course home</strong><small>Dashboard + progress</small></span>
      </button>

      <nav id="week-navigation"></nav>

      <div class="sidebar-footer">
        <a href="docs/lesson-plan.md">Full text syllabus</a>
        <a href="docs/progress-tracker.md">Progress notes</a>
      </div>
    </aside>

    <main id="app-main" class="main-content" tabindex="-1">
      <section id="dashboard-view" class="view"></section>
      <section id="lesson-view" class="view" hidden></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript">
      This learning platform uses JavaScript for navigation, Mermaid diagrams, 3D concept demos, and progress tracking.
      You can still use <a href="docs/lesson-plan.md">the Markdown lesson plan</a>.
    </div>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
